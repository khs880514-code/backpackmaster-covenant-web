<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Backpack Master Covenant</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const requestedLocale = new URLSearchParams(window.location.search).get('locale');
GODOT_CONFIG.locale = requestedLocale || navigator.language || 'en';
document.documentElement.lang = GODOT_CONFIG.locale.toLowerCase().startsWith('ko') ? 'ko' : 'en';
const GODOT_THREADS_ENABLED = false;
const SPLIT_PACK_MANIFEST = 'index.pck.ea0d603697f1374e.parts.json';
const engine = new Engine(GODOT_CONFIG);
const WEB_STATE = {
	mode: 'loading',
	packageBytesLoaded: 0,
	packageBytesTotal: 131282732,
	packageSha256: 'ea0d603697f1374ede34f6db4a00b606c3f92a4347eca1d327bfb2fabdf9f6bf',
};
window.render_game_to_text = () => JSON.stringify({
	coordinateSystem: 'Godot canvas; origin top-left, x right, y down',
	mode: WEB_STATE.mode,
	canvas: {
		width: document.getElementById('canvas').width,
		height: document.getElementById('canvas').height,
	},
	package: {
		loaded: WEB_STATE.packageBytesLoaded,
		total: WEB_STATE.packageBytesTotal,
		sha256: WEB_STATE.packageSha256,
	},
});

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		WEB_STATE.mode = 'error';
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	async function sha256Hex(buffer) {
		if (!globalThis.crypto || !globalThis.crypto.subtle) {
			throw new Error('This browser cannot verify the game package.');
		}
		const digest = await globalThis.crypto.subtle.digest('SHA-256', buffer);
		return Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, '0')).join('');
	}

	async function loadSplitPack() {
		const manifestResponse = await fetch(SPLIT_PACK_MANIFEST, { cache: 'no-store' });
		if (!manifestResponse.ok) {
			throw new Error(`Game package manifest failed to load (${manifestResponse.status}).`);
		}
		const manifest = await manifestResponse.json();
		if (manifest.schema !== 'bm2-godot-web-split-pack-v1'
				|| !manifest.original || !Number.isSafeInteger(manifest.original.size)
				|| !Array.isArray(manifest.parts) || manifest.parts.length === 0) {
			throw new Error('Game package manifest is invalid.');
		}

		const pack = new Uint8Array(manifest.original.size);
		let offset = 0;
		statusProgress.value = 0;
		statusProgress.max = manifest.original.size;
		for (const part of manifest.parts) {
			const response = await fetch(part.file);
			if (!response.ok) {
				throw new Error(`Game package part failed to load (${response.status}).`);
			}
			const buffer = await response.arrayBuffer();
			if (buffer.byteLength !== part.size || await sha256Hex(buffer) !== part.sha256) {
				throw new Error(`Game package part failed integrity verification: ${part.file}`);
			}
			pack.set(new Uint8Array(buffer), offset);
			offset += buffer.byteLength;
			WEB_STATE.packageBytesLoaded = offset;
			statusProgress.value = offset;
		}
		if (offset !== manifest.original.size || await sha256Hex(pack.buffer) !== manifest.original.sha256) {
			throw new Error('The reconstructed game package failed integrity verification.');
		}
		return pack.buffer;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		Promise.all([
			Engine.load('index', GODOT_CONFIG.fileSizes['index.wasm']),
			loadSplitPack(),
		]).then(([, pack]) => engine.preloadFile(pack, 'index.pck')).then(() => engine.start({
			'args': ['--main-pack', 'index.pck'],
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		})).then(() => {
			WEB_STATE.mode = 'running';
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
