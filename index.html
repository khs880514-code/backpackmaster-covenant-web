<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Backpack Master Covenant</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
	position: absolute;
	top: 0;
	left: 0;
	touch-action: none;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const requestedLocale = new URLSearchParams(window.location.search).get('locale');
GODOT_CONFIG.locale = requestedLocale || navigator.language || 'en';
document.documentElement.lang = GODOT_CONFIG.locale.toLowerCase().startsWith('ko') ? 'ko' : 'en';
const GODOT_THREADS_ENABLED = false;
const SPLIT_PACK_MANIFEST = 'index.pck.d7c0d1d7c915871a.parts.json';
// The shell drives canvas sizing so the render resolution is not tied to CSS pixels.
GODOT_CONFIG.canvasResizePolicy = 0;

const RenderQuality = (function () {
	const canvas = document.getElementById('canvas');
	const STORAGE_KEY = 'bmc.renderScale';
	const MIN_SCALE = 0.5;
	const MAX_SCALE = 4;
	// 'low' pins one render pixel per CSS pixel, 'native' follows the display
	// density, and the supersampling presets aim above it when there is headroom.
	const PRESETS = ['low', 'native', 'high', 'ultra'];
	const SUPERSAMPLE_TARGETS = { high: 2, ultra: 3 };
	const DEFAULT_PRESET = 'high';
	const params = new URLSearchParams(window.location.search);

	let requested = DEFAULT_PRESET;
	let current = null;
	let resizeHandle = 0;
	let guardRunning = false;

	function clamp(value, low, high) {
		return Math.min(high, Math.max(low, value));
	}

	function readStored() {
		try {
			return window.localStorage.getItem(STORAGE_KEY);
		} catch (err) {
			return null;
		}
	}

	function writeStored(value) {
		try {
			window.localStorage.setItem(STORAGE_KEY, String(value));
		} catch (err) {
			// Private browsing and blocked storage are not fatal.
		}
	}

	function normalize(value) {
		if (value === null || value === undefined) {
			return null;
		}
		const text = String(value).trim().toLowerCase();
		if (PRESETS.indexOf(text) !== -1) {
			return text;
		}
		const numeric = Number.parseFloat(text);
		if (Number.isFinite(numeric) && numeric > 0) {
			return clamp(numeric, MIN_SCALE, MAX_SCALE);
		}
		return null;
	}

	function devicePixelScale() {
		return clamp(window.devicePixelRatio || 1, 1, MAX_SCALE);
	}

	function isHandheld() {
		const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
		return !!coarse || Math.min(window.innerWidth, window.innerHeight) < 600;
	}

	function pixelBudget() {
		return isHandheld() ? 2500000 : 5000000;
	}

	function resolveScale(cssWidth, cssHeight) {
		if (typeof requested === 'number') {
			return requested;
		}
		const devicePixels = devicePixelScale();
		if (requested === 'low') {
			return 1;
		}
		if (requested === 'native') {
			return devicePixels;
		}
		// Supersample beyond the display density when the GPU budget allows it, but
		// never drop below what the display itself asks for.
		const budget = pixelBudget();
		let scale = Math.max(devicePixels, SUPERSAMPLE_TARGETS[requested]);
		while (scale > devicePixels && cssWidth * cssHeight * scale * scale > budget) {
			scale -= 0.25;
		}
		return clamp(scale, devicePixels, MAX_SCALE);
	}

	function apply() {
		const cssWidth = Math.max(1, Math.round(window.innerWidth));
		const cssHeight = Math.max(1, Math.round(window.innerHeight));
		const scale = resolveScale(cssWidth, cssHeight);
		const width = Math.max(1, Math.round(cssWidth * scale));
		const height = Math.max(1, Math.round(cssHeight * scale));
		if (canvas.style.width !== `${cssWidth}px` || canvas.style.height !== `${cssHeight}px`) {
			canvas.style.width = `${cssWidth}px`;
			canvas.style.height = `${cssHeight}px`;
		}
		if (canvas.width !== width || canvas.height !== height) {
			canvas.width = width;
			canvas.height = height;
		}
		current = {
			requested: requested,
			scale: scale,
			devicePixelRatio: window.devicePixelRatio || 1,
			cssSize: [cssWidth, cssHeight],
			renderSize: [width, height],
		};
		return current;
	}

	function scheduleApply() {
		if (resizeHandle) {
			return;
		}
		resizeHandle = window.requestAnimationFrame(() => {
			resizeHandle = 0;
			apply();
		});
	}

	function watchPixelRatio() {
		if (!window.matchMedia) {
			return;
		}
		const query = window.matchMedia(`(resolution: ${window.devicePixelRatio || 1}dppx)`);
		const onChange = () => {
			scheduleApply();
			watchPixelRatio();
		};
		if (query.addEventListener) {
			query.addEventListener('change', onChange, { once: true });
		} else if (query.addListener) {
			query.addListener(onChange);
		}
	}

	// Supersampling is the first thing to go if the device cannot keep a smooth
	// frame rate; auto mode never falls below the display's own pixel density,
	// so the worst case is exactly what the browser would render without it.
	function startPerformanceGuard() {
		if (guardRunning || typeof requested !== 'string' || requested === 'low' || requested === 'native') {
			return;
		}
		guardRunning = true;
		const SAMPLE_MS = 4000;
		const MIN_FPS = 45;
		let windowStart = 0;
		let frames = 0;
		let slowWindows = 0;
		let downgrades = 0;

		function tick(now) {
			if (!current || current.scale <= devicePixelScale() || downgrades >= 3) {
				guardRunning = false;
				return;
			}
			if (document.visibilityState !== 'visible') {
				windowStart = 0;
				frames = 0;
			} else if (windowStart === 0) {
				windowStart = now;
				frames = 0;
			} else {
				frames += 1;
				const elapsed = now - windowStart;
				if (elapsed >= SAMPLE_MS) {
					const fps = (frames * 1000) / elapsed;
					slowWindows = fps < MIN_FPS ? slowWindows + 1 : 0;
					if (slowWindows >= 2) {
						slowWindows = 0;
						downgrades += 1;
						set(Math.max(devicePixelScale(), current.scale - 0.5), { persist: false });
					}
					windowStart = now;
					frames = 0;
				}
			}
			window.requestAnimationFrame(tick);
		}

		window.requestAnimationFrame(tick);
	}

	function set(value, options) {
		const normalized = normalize(value);
		if (normalized === null) {
			return current;
		}
		requested = normalized;
		if (!options || options.persist !== false) {
			writeStored(normalized);
		}
		return apply();
	}

	const fromUrl = normalize(params.get('render_scale')) ?? normalize(params.get('quality'));
	requested = fromUrl ?? normalize(readStored()) ?? DEFAULT_PRESET;
	if (fromUrl !== null) {
		// A shared "?quality=..." link should survive a reload.
		writeStored(fromUrl);
	}

	apply();
	window.addEventListener('resize', scheduleApply, false);
	window.addEventListener('orientationchange', scheduleApply, false);
	['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach((name) => {
		document.addEventListener(name, scheduleApply, false);
	});
	// Mobile browsers do not always fire 'resize' for toolbar and keyboard
	// transitions, so reconcile periodically as well. apply() is a no-op when
	// nothing changed.
	window.setInterval(scheduleApply, 2000);
	watchPixelRatio();

	return {
		apply: apply,
		set: set,
		startPerformanceGuard: startPerformanceGuard,
		status: () => current,
	};
}());

// Ask for the discrete GPU on multi-GPU machines; the engine only requests a
// default-power context, which often lands on the integrated chip.
(function preferHighPerformanceGPU() {
	const canvas = document.getElementById('canvas');
	const getContext = canvas.getContext.bind(canvas);
	canvas.getContext = function (type, attributes) {
		if (typeof type === 'string' && type.startsWith('webgl')) {
			return getContext(type, Object.assign({}, attributes, { powerPreference: 'high-performance' }));
		}
		return getContext(type, attributes);
	};
}());

window.set_render_scale = (value) => RenderQuality.set(value);
window.get_render_scale = () => RenderQuality.status();

const engine = new Engine(GODOT_CONFIG);
const WEB_STATE = {
	mode: 'loading',
	packageBytesLoaded: 0,
	packageBytesTotal: 131287752,
	packageSha256: 'd7c0d1d7c915871a20c5cd81632a84a4a48469af1879a1c46580243aebb8347e',
};
window.render_game_to_text = () => JSON.stringify({
	coordinateSystem: 'Godot canvas; origin top-left, x right, y down',
	mode: WEB_STATE.mode,
	canvas: {
		width: document.getElementById('canvas').width,
		height: document.getElementById('canvas').height,
	},
	render: RenderQuality.status(),
	package: {
		loaded: WEB_STATE.packageBytesLoaded,
		total: WEB_STATE.packageBytesTotal,
		sha256: WEB_STATE.packageSha256,
	},
});

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		WEB_STATE.mode = 'error';
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	async function sha256Hex(buffer) {
		if (!globalThis.crypto || !globalThis.crypto.subtle) {
			throw new Error('This browser cannot verify the game package.');
		}
		const digest = await globalThis.crypto.subtle.digest('SHA-256', buffer);
		return Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, '0')).join('');
	}

	async function loadSplitPack() {
		const manifestResponse = await fetch(SPLIT_PACK_MANIFEST, { cache: 'no-store' });
		if (!manifestResponse.ok) {
			throw new Error(`Game package manifest failed to load (${manifestResponse.status}).`);
		}
		const manifest = await manifestResponse.json();
		if (manifest.schema !== 'bm2-godot-web-split-pack-v1'
				|| !manifest.original || !Number.isSafeInteger(manifest.original.size)
				|| !Array.isArray(manifest.parts) || manifest.parts.length === 0) {
			throw new Error('Game package manifest is invalid.');
		}

		const pack = new Uint8Array(manifest.original.size);
		let offset = 0;
		statusProgress.value = 0;
		statusProgress.max = manifest.original.size;
		for (const part of manifest.parts) {
			const response = await fetch(part.file);
			if (!response.ok) {
				throw new Error(`Game package part failed to load (${response.status}).`);
			}
			const buffer = await response.arrayBuffer();
			if (buffer.byteLength !== part.size || await sha256Hex(buffer) !== part.sha256) {
				throw new Error(`Game package part failed integrity verification: ${part.file}`);
			}
			pack.set(new Uint8Array(buffer), offset);
			offset += buffer.byteLength;
			WEB_STATE.packageBytesLoaded = offset;
			statusProgress.value = offset;
		}
		if (offset !== manifest.original.size || await sha256Hex(pack.buffer) !== manifest.original.sha256) {
			throw new Error('The reconstructed game package failed integrity verification.');
		}
		return pack.buffer;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		Promise.all([
			Engine.load('index', GODOT_CONFIG.fileSizes['index.wasm']),
			loadSplitPack(),
		]).then(([, pack]) => engine.preloadFile(pack, 'index.pck')).then(() => engine.start({
			'args': ['--main-pack', 'index.pck'],
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		})).then(() => {
			WEB_STATE.mode = 'running';
			setStatusMode('hidden');
			RenderQuality.startPerformanceGuard();
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
