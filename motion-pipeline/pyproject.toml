[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mocap-demo-pipeline"
version = "0.1.0"
description = "Video to retargeted, rendered demonstration motion, for self-defence instruction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
# The 2D detector. CPU-only and enough for one clearly framed subject.
detect = ["mediapipe>=0.10", "opencv-python-headless>=4.8"]
dev = ["pytest>=7.4"]

[project.scripts]
mocap = "mocap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mocap = ["blender/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
